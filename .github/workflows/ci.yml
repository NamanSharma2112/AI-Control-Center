name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Typecheck and build the panel
        run: npm run build
      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri

  # The window-focusing and tray code is written per platform and cannot be
  # compiled on Linux, so every push also lints and tests it on Windows and
  # macOS themselves.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # The Rust build embeds the built panel, so it must exist first.
      - run: npm run build
      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --lib
        working-directory: src-tauri
