name: Release

# Publishes a GitHub Release with a macOS and a Windows installer, which the
# README's download buttons link to. Two ways to start it:
#  - Actions -> Release -> Run workflow (the "publish" box ticked): releases
#    the version in src-tauri/tauri.conf.json, e.g. v0.1.0. The tag is
#    created by GitHub when the release is published; nothing to push.
#  - Pushing a version tag (v0.1.0).
# Run by hand with "publish" unticked to only build the installers as
# downloadable workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in tauri.conf.json
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Decides the tag and creates one draft release up front, so the two
  # platform builds upload into the same release instead of racing.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo "Build only; no release."
            exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          # Never overwrite a version that is already out.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n1)
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::$TAG is already published. Bump the version in tauri.conf.json, Cargo.toml and package.json first."
              exit 1
            fi
            echo "Reusing draft release $id for $TAG"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="AI Control Center $TAG" -F draft=true \
              -f body="Download the installer for your system below. See the README for first-run steps." \
              --jq .id)
            echo "Created draft release $id for $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Signing and auto-update are optional. Each secret is passed on only if
      # it is actually set: an empty variable would make the bundler try (and
      # fail) to sign with nothing. With no secrets, the installers are built
      # unsigned and without the updater, and still work.
      - name: Configure optional signing and updates
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
        run: |
          pass_on() {
            local name="$1" value="${!1}"
            [ -z "$value" ] && return 1
            { echo "$name<<__ACC_EOF__"; echo "$value"; echo "__ACC_EOF__"; } >> "$GITHUB_ENV"
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              pass_on "$v" && echo "macOS signing: $v set" || echo "macOS signing: $v not set"
            done
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            pass_on TAURI_SIGNING_PRIVATE_KEY
            pass_on TAURI_SIGNING_PRIVATE_KEY_PASSWORD || true
            cat > src-tauri/tauri.updater.conf.json <<JSON
          {
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": {
              "updater": {
                "pubkey": "$UPDATER_PUBKEY",
                "endpoints": ["https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"]
              }
            }
          }
          JSON
            echo "ACC_UPDATER=1" >> "$GITHUB_ENV"
            echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
            echo "Auto-update: enabled"
          else
            echo "Auto-update: not configured (see RELEASING.md)"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Uploads into the draft from the prepare job; with no release it
          # just builds.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}

      - name: Keep the installers from a build-only run
        if: needs.prepare.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Runs only after BOTH installers built, so a half-finished release is never
  # published. It adds copies with fixed names (so the README download buttons
  # never go stale) and then makes the draft release public.
  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.release_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Name the installers and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*-setup.exe'
          [ "$(ls *.dmg | wc -l)" -eq 1 ] || { echo "expected exactly one .dmg"; ls; exit 1; }
          [ "$(ls *-setup.exe | wc -l)" -eq 1 ] || { echo "expected exactly one -setup.exe"; ls; exit 1; }
          mv *.dmg AI-Control-Center-macOS.dmg
          mv *-setup.exe AI-Control-Center-Windows-setup.exe
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            AI-Control-Center-macOS.dmg AI-Control-Center-Windows-setup.exe
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
